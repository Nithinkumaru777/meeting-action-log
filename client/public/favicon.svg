<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161d27" />
      <stop offset="100%" stop-color="#0b0e13" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#2d3748" stroke-width="2" filter="url(#glow)" />

  <!-- Gold Accent Indicator Dot -->
  <circle cx="51" cy="13" r="4" fill="url(#goldGrad)" stroke="#0b0e13" stroke-width="1.5" />

  <!-- Top Checkmark -->
  <path d="M12 21 L18 27 L28 16" fill="none" stroke="url(#tealGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Checkmark -->
  <path d="M12 43 L18 49 L28 38" fill="none" stroke="url(#tealGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Ledger Rows -->
  <line x1="35" y1="18.5" x2="52" y2="18.5" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" />
  <line x1="35" y1="29.5" x2="48" y2="29.5" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="35" y1="40.5" x2="52" y2="40.5" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" />
  <line x1="35" y1="49.5" x2="45" y2="49.5" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />
</svg>
